name: Update Animated README Cards

on:
  schedule:
    - cron: '0 0 * * *' # Refreshes every day at midnight
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render README cards
        run: python scripts/render_readme_cards.py

      - name: Commit and push changes
        run: |
          git config --global user.name "YadneshBamne"
          git config --global user.email "yadnesh2105@gmail.com"
          git add cards/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cards): refresh animated profile cards [skip ci]" && git push)
