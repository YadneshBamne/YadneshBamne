          <g transform="translate(516, 65)">
            <rect width="26" height="45" rx="4" fill="#151324" stroke="#261f3d" stroke-width="1">
              
            </rect>
            
          </g>
          <text x="529" y="130" font-size="10.5" font-weight="500" fill="#6b6487" text-anchor="middle">Dec</text>
        
