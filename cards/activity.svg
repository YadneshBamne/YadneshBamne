<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <style>
      * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", sans-serif;
      }
    </style>
  </defs>

  <rect width="880" height="180" rx="14" fill="#0f0d1a" stroke="#261f3d" stroke-width="1.2" />

  <!-- Left Stats Block -->
  <g transform="translate(42, 34)">
    <text font-size="11" font-weight="800" fill="#c084fc" letter-spacing="1.5">ACTIVITY MATRIX</text>
    <text y="32" font-size="28" font-weight="800" fill="#f5f3ff">1,400+ <tspan font-size="14" font-weight="500" fill="#6b6487">Commits / Year</tspan></text>
    
    <g transform="translate(0, 68)">
      <g transform="translate(0, 0)">
        <text font-size="11" font-weight="600" fill="#6b6487">DAILY STREAK</text>
        <text y="20" font-size="18" font-weight="800" fill="#34d399">42 Days</text>
      </g>
      <g transform="translate(110, 0)">
        <text font-size="11" font-weight="600" fill="#6b6487">BUSIEST DAY</text>
        <text y="20" font-size="18" font-weight="800" fill="#a855f7">34 Commits</text>
      </g>
      <g transform="translate(225, 0)">
        <text font-size="11" font-weight="600" fill="#6b6487">PRIMARY</text>
        <text y="20" font-size="18" font-weight="800" fill="#38bdf8">TypeScript</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="335" y1="25" x2="335" y2="155" stroke="#261f3d" stroke-width="1" />

  <!-- Right Chart: Monthly Distribution -->
  <g transform="translate(330, 20)">
    
          <g transform="translate(32, 90)">
