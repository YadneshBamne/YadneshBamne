<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Violet Glow Linear Gradient with SMIL Animated Sweep -->
    <linearGradient id="violetShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#c084fc" stop-opacity="1">
        <animate attributeName="offset" values="-0.3; 1.3" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.9">
        <animate attributeName="offset" values="-0.1; 1.5" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Glow Background -->
    <radialGradient id="cardGlow" cx="15%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#09080f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="terminalGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09080f" stop-opacity="0" />
    </radialGradient>

    <style>
      
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes rowPrint {
        0% { opacity: 0; }
        100% { opacity: 0.95; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes statusPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.85); opacity: 0.4; }
      }
      .hero-title {
        animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .hero-role {
        animation: fadeInUp 0.7s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      .hero-badges {
        animation: fadeInUp 0.7s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      .ascii-row {
        opacity: 0;
        animation: rowPrint 0.1s forwards;
      }
      .pulse-dot {
        animation: statusPulse 2s infinite ease-in-out;
      }
      .glow-blob {
        animation: pulseGlow 5s infinite ease-in-out;
      }
    
      * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="290" rx="14" fill="#0f0d1a" stroke="#261f3d" stroke-width="1.2" />
  <rect width="880" height="290" rx="14" fill="url(#cardGlow)" />
  <rect width="880" height="290" rx="14" fill="url(#terminalGlow)" class="glow-blob" />

  <!-- Left Content: Profile Info -->
  <g transform="translate(42, 44)">
    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <rect width="270" height="26" rx="13" fill="#151324" stroke="#3b2d61" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#34d399" class="pulse-dot" />
      <text x="28" y="17" font-size="10.5" font-weight="700" fill="#c084fc" letter-spacing="1">BUILDING PRODUCTION WEB EXPERIENCES</text>
    </g>

    <!-- Name with Violet Shine -->
    <g class="hero-title" transform="translate(0, 72)">
      <text font-size="38" font-weight="800" fill="url(#violetShine)" letter-spacing="-0.5">Yadnesh Bamne</text>
    </g>

    <!-- Role & Subtitle -->
    <g class="hero-role" transform="translate(0, 108)">
      <text font-size="16" font-weight="500" fill="#a7a1c4">Full-Stack Engineer & Systems Builder</text>
      <text y="24" font-size="13" font-weight="400" fill="#6b6487">Crafting scalable architectures, interactive engines &amp; reliable platforms</text>
    </g>

    <!-- Skill Tags / Pills -->
    <g class="hero-badges" transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="82" height="25" rx="6" fill="#151324" stroke="#261f3d" />
        <text x="41" y="16.5" font-size="11" font-weight="600" fill="#f5f3ff" text-anchor="middle">Next.js 16</text>
      </g>
      <g transform="translate(90, 0)">
        <rect width="95" height="25" rx="6" fill="#151324" stroke="#261f3d" />
        <text x="47.5" y="16.5" font-size="11" font-weight="600" fill="#f5f3ff" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(193, 0)">
        <rect width="82" height="25" rx="6" fill="#151324" stroke="#261f3d" />
        <text x="41" y="16.5" font-size="11" font-weight="600" fill="#f5f3ff" text-anchor="middle">React 19</text>
      </g>
      <g transform="translate(283, 0)">
        <rect width="82" height="25" rx="6" fill="#151324" stroke="#261f3d" />
        <text x="41" y="16.5" font-size="11" font-weight="600" fill="#f5f3ff" text-anchor="middle">Tailwind v4</text>
      </g>
      <g transform="translate(373, 0)">
        <rect width="78" height="25" rx="6" fill="#151324" stroke="#261f3d" />
        <text x="39" y="16.5" font-size="11" font-weight="600" fill="#f5f3ff" text-anchor="middle">Node.js</text>
      </g>
    </g>
  </g>

  <!-- Right Content: Terminal ASCII Window -->
  <g transform="translate(545, 34)">
    <!-- Terminal Frame -->
    <rect width="295" height="222" rx="10" fill="#09080f" stroke="#261f3d" stroke-width="1.2" />
    <rect width="295" height="26" rx="10" fill="#151324" />
    <!-- Terminal Header Dots -->
    <circle cx="16" cy="13" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="30" cy="13" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="44" cy="13" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="147" y="17" font-size="10" font-family="monospace" fill="#6b6487" text-anchor="middle">yadnesh@core: ~</text>

    <!-- Terminal Code / ASCII -->
    <text font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="9" fill="#c084fc">
      <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.20s;">  .---.   .---.   .---.   .---.  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.24s;"> /   . \ /   . \ /   . \ /   . \ </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.28s;">|  (o)  |  (o)  |  (o)  |  (o)  |</tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.32s;"> \     / \     / \     / \     / </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.36s;">  '---'   '---'   '---'   '---'  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.40s;">     _       _       _       _   </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.44s;">   /   \   /   \   /   \   /   \ </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.48s;">  |  Y  | |  A  | |  D  | |  N  |</tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.52s;">   \ _ /   \ _ /   \ _ /   \ _ / </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.56s;">  =============================  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.60s;">   [ CORE :: SYSTEMS ACTIVE ]    </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.64s;">  -----------------------------  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.68s;">  :: STACK : NEXT.JS / REACT ::  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.72s;">  :: LANG  : TS / NODE / PY  ::  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.76s;">  :: SPEED : &lt;50ms SSR LCP   ::  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.80s;">  :: STATUS: DEPLOYING DAILY ::  </tspan>
            <tspan x="18" dy="12" class="ascii-row" style="animation-delay: 0.84s;">  =============================  </tspan>
    </text>
  </g>
</svg>